# V2.1 continuous-eye LIVE profile. Endpoint values are operator-reviewed.
dca:
  resource: TCPIP0::Nate-Rog::hislip0,4880::INSTR
  expected_idn_prefix: "Keysight Technologies,N1010A,"
  function: 1
  timeout_ms: 180000

# Retained for strict profile validation only. The continuous I2C runtime builds
# a rejecting placeholder and never constructs or contacts a BERT client.
bert:
  ip: 192.168.3.2
  local_ip: 192.168.3.1
  udp_port: 9000
  port: port1
  channel: "0"
  timeout_s: 2.0

i2c:
  port: COM7
  baudrate: 115200
  device_address: 0xA6
  chip_id_register: 0x0004
  expected_chip_id: 0x52
  chip_revision_register: 0x0005
  expected_chip_revision: 0x00

characterization:
  default_channel: 0
  baseline_repeats: 5
  measurement_timeout_s: 180
  poll_interval_s: 1
  meaningful_er_floor_db: null
  meaningful_tdecq_floor_db: null
  tdecq:
    source: FUNC1
  er:
    source: CHAN1A
    value_query: ":MEASure:EYE:OER?"
    source_query: ":MEASure:EYE:OER:SOURce?"
    status_query: ":MEASure:EYE:OER:STATus?"
    details_query: ":MEASure:EYE:OER:STATus:DETails?"
    units_query: ":MEASure:EYE:OER:UNITs?"
  parameters:
    ibias_dac: {address: 0x2002, bit_start: 0, bits: 7}
    efin_cur: {address: 0x2003, bit_start: 0, bits: 4}
    vga_cur: {address: 0x2005, bit_start: 0, bits: 4}
    eq: {address: 0x2006, bit_start: 0, bits: 5}
    res_gain: {address: 0x2007, bit_start: 0, bits: 4}
    res_bw: {address: 0x2008, bit_start: 0, bits: 4}
    gain_ctrl: {address: 0x2009, bit_start: 0, bits: 6}
    vbias_ref: {address: 0x200A, bit_start: 0, bits: 4}
    vref: {address: 0x200B, bit_start: 0, bits: 4}
  # Confirmed encoding envelopes; max_step is 15%, rounded up to an integer.
  safety_limits:
    ibias_dac: {minimum: 0, maximum: 127, max_step: 20}
    efin_cur: {minimum: 0, maximum: 15, max_step: 3}
    vga_cur: {minimum: 0, maximum: 15, max_step: 3}
    eq: {minimum: 0, maximum: 31, max_step: 5}
    res_gain: {minimum: 0, maximum: 15, max_step: 3}
    res_bw: {minimum: 0, maximum: 15, max_step: 3}
    gain_ctrl: {minimum: 0, maximum: 63, max_step: 10}
    vbias_ref: {minimum: 0, maximum: 15, max_step: 3}
    vref: {minimum: 0, maximum: 15, max_step: 3}
