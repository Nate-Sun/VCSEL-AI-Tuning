[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "vcsel-ai-tuning"
version = "1.1.0"
description = "Safe digital-twin and hardware-ready VCSEL PAM4 tuning framework"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "numpy>=2.0",
  "pydantic>=2.9",
  "PyYAML>=6.0",
  "scipy>=1.14",
  "uvicorn>=0.34",
]

[project.optional-dependencies]
dev = [
  "httpx>=0.28",
  "pytest>=8.3",
  "pytest-cov>=5.0",
]
hardware = [
  "pyvisa>=1.15",
  "pyserial>=3.5",
]
kimi = [
  "openai>=1.0",
  "Pillow>=11.0",
]
optimizer = [
  "scikit-learn>=1.9,<2",
]
desktop-build = [
  "openai>=1.0",
  "Pillow>=11.0",
  "pyinstaller>=6.16,<7",
  "pyserial>=3.5",
  "pyvisa>=1.15",
  "scikit-learn>=1.9,<2",
]

[project.scripts]
vcsel-tune = "vcsel_ai_tuning.cli:main"
vcsel-fir-demo = "vcsel_ai_tuning.hardware.demo_cli:main"
vcsel-live-fir = "vcsel_ai_tuning.hardware.live_cli:main"
vcsel-hw-characterize = "vcsel_ai_tuning.hardware.characterization_cli:main"
vcsel-ai-api = "vcsel_ai_tuning.api.app:main"
vcsel-continuous-eye = "vcsel_ai_tuning.v2.continuous.cli:main"
vcsel-continuous-eye-desktop = "vcsel_ai_tuning.desktop.main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests_py/ai_tuning"]
addopts = "-ra"
