# Safe default: built-in deterministic fake adapters, no hardware connection.
# 安全默认值：使用内置确定性 fake Adapter，不连接硬件。
mode: FAKE
api:
  host: 127.0.0.1
  port: 8000
storage:
  sqlite_path: ../../state/ai_tuning/campaigns.sqlite3
  artifact_root: ../../artifacts/ai_tuning
b0_path: b0.yaml
measurement_timeout_s: 30.0
worker_count: 2

